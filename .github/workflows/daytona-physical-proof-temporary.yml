name: Temporary Daytona Physical Qualification

on:
  push:
    branches:
      - proof/daytona-physical-fixed-20261016

permissions:
  contents: read

jobs:
  daytona-physical-proof:
    name: DAYTONA physical render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHORTFORGE_LIVE_SANDBOX_PROVIDER: DAYTONA
      SHORTFORGE_LIVE_SANDBOX_IMAGE: python:3.12
      SHORTFORGE_LIVE_SANDBOX_OUTPUT_PATH: /tmp/shortforge/live-smoke.mp4
      SHORTFORGE_LIVE_SANDBOX_EVIDENCE_PATH: /tmp/shortforge/live-sandbox-f07-evidence.json
      SHORTFORGE_LIVE_SANDBOX_RENDER_COMMAND: >-
        mkdir -p /tmp/shortforge &&
        if command -v ffmpeg >/dev/null 2>&1; then true;
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache ffmpeg;
        elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends ffmpeg;
        else echo "FFMPEG_INSTALL_UNSUPPORTED"; exit 127; fi &&
        ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=1
        -f lavfi -i anullsrc=r=48000:cl=mono -shortest
        -c:v libx264 -pix_fmt yuv420p -c:a aac
        {{OUTPUT_PATH}}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
      DAYTONA_TARGET: ${{ secrets.DAYTONA_TARGET }}
      DAYTONA_SANDBOX_IMAGE: python:3.12
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Daytona SDK
        run: npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund @daytona/sdk
      - name: Install verifier-host FFmpeg / FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck
      - name: Run Daytona physical render proof
        run: npx vitest run factoryos/tests/live-hosted-sandbox.test.ts --config vitest.config.ts --reporter=verbose
      - name: Upload Daytona F07 physical proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytona-physical-f07-evidence
          path: /tmp/shortforge/live-sandbox-f07-evidence.json
          if-no-files-found: warn
