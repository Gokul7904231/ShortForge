name: AER Shadow Evidence Qualification

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/intelligence/epistemic/**"
      - "apps/web/factoryos/tests/epistemic/**"
      - "docs/ascalon/aer-shadow-evidence.md"
      - ".github/workflows/aer-shadow-evidence.yml"

permissions:
  contents: read

jobs:
  shadow-evidence:
    name: AER shadow evidence tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: FactoryOS strict typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: AER core, auxiliary, and shadow evidence tests
        working-directory: apps/web
        run: npx vitest run factoryos/tests/epistemic/aer.test.ts factoryos/tests/epistemic/aer-auxiliary.test.ts factoryos/tests/epistemic/aer-remediation.test.ts
