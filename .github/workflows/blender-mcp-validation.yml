name: Blender MCP Validation

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/comms/**"
      - "apps/web/factoryos/core/intelligence/visual/**"
      - "apps/web/factoryos/core/cognitive/CapabilityRegistry.ts"
      - "apps/web/factoryos/core/cognitive/routing/CapabilityRouter.ts"
      - "training/ascalon/**"
      - "docs/ascalon/blender-integration.md"
      - "docs/operations/blender-mcp-production.md"
      - ".okf/security/mcp-permissions.md"
      - ".okf/research/repo-mappings/blender-mcp-shortforge-20260930.md"
      - "testing/tests/blender-*.test.ts"
      - "testing/tests/ascalon-blender-decision-bridge.test.ts"
      - "apps/web/vitest.config.ts"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "apps/web/factoryos/core/comms/**"
      - "apps/web/factoryos/core/intelligence/visual/**"
      - "apps/web/factoryos/core/cognitive/CapabilityRegistry.ts"
      - "apps/web/factoryos/core/cognitive/routing/CapabilityRouter.ts"
      - "training/ascalon/**"
      - "testing/tests/blender-*.test.ts"
      - "testing/tests/ascalon-blender-decision-bridge.test.ts"

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: FactoryOS typecheck
        run: npm run factoryos:typecheck

      - name: Blender MCP contract tests
        run: >
          npx vitest run
          ../../testing/tests/blender-mcp-contract.test.ts
          ../../testing/tests/blender-capability-registry.test.ts
          ../../testing/tests/ascalon-blender-decision-bridge.test.ts
          factoryos/tests/cognitive-telemetry-router.test.ts
          --config vitest.config.ts

      - name: Blender MCP training ontology validation
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const files = [
            "../../training/ascalon/ontology/blender-capabilities.json",
            "../../training/ascalon/ontology/capabilities.json",
            "../../training/ascalon/ontology/authority.json"
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log("validated", file);
          }
          '
