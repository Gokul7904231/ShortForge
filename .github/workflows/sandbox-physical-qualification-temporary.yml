name: Temporary OpenComputer and Blaxel Qualification (Current F07 Policy)

on:
  push:
    branches:
      - proof/sandbox-policy-qualified-20261017

permissions:
  contents: read

jobs:
  hosted-sandbox-proof:
    name: ${{ matrix.provider }} physical render and F07 proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [OPENCOMPUTER, BLAXEL]
    env:
      SHORTFORGE_LIVE_SANDBOX_PROVIDER: ${{ matrix.provider }}
      SHORTFORGE_LIVE_SANDBOX_IMAGE: ghcr.io/jrottenberg/ffmpeg:9.0.1-ubuntu2404
      SHORTFORGE_LIVE_SANDBOX_OUTPUT_PATH: /tmp/shortforge/live-smoke.mp4
      SHORTFORGE_LIVE_SANDBOX_EVIDENCE_PATH: /tmp/shortforge/live-sandbox-f07-evidence.json
      SHORTFORGE_LIVE_SANDBOX_RENDER_COMMAND: >-
        mkdir -p /tmp/shortforge &&
        if command -v ffmpeg >/dev/null 2>&1; then true;
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache ffmpeg;
        elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends ffmpeg;
        else echo "FFMPEG_INSTALL_UNSUPPORTED"; exit 127; fi &&
        ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=1
        -f lavfi -i anullsrc=r=48000:cl=mono -shortest
        -c:v libx264 -pix_fmt yuv420p -c:a aac
        {{OUTPUT_PATH}}
      OPENCOMPUTER_API_KEY: ${{ secrets.OPENCOMPUTER_API_KEY }}
      OPENCOMPUTER_API_URL: ${{ secrets.OPENCOMPUTER_API_URL }}
      OPENCOMPUTER_TEMPLATE: base
      BL_API_KEY: ${{ secrets.BL_API_KEY }}
      BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
      BLAXEL_SANDBOX_IMAGE: blaxel/base-image:latest
      BLAXEL_REGION: ${{ secrets.BLAXEL_REGION }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install selected provider SDK
        run: |
          case "$SHORTFORGE_LIVE_SANDBOX_PROVIDER" in
            OPENCOMPUTER) set -- @opencomputer/sdk@2.3.0 ;;
            BLAXEL) set -- @blaxel/core@0.3.25 ;;
            *) echo "Unsupported provider"; exit 2 ;;
          esac
          npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund "$@"
      - name: Install verifier-host FFmpeg / FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck
      - name: Run live hosted sandbox proof against refreshed F07 policy
        run: npx vitest run factoryos/tests/live-hosted-sandbox.test.ts --config vitest.config.ts --reporter=verbose
      - name: Upload provider-specific F07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-f07-evidence-${{ matrix.provider }}
          path: /tmp/shortforge/live-sandbox-f07-evidence.json
          if-no-files-found: warn
