name: One-shot stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          refs="$(curl -fsSL "${headers[@]}" "${api}/git/matching-refs/heads/" | jq -r '.[].ref' | sed 's#^refs/heads/##')"
          count=0

          while IFS= read -r branch; do
            [ -z "${branch}" ] && continue
            [ "${branch}" = "${DEFAULT_BRANCH}" ] && continue

            echo "Deleting branch: ${branch}"
            encoded="${branch//\//%2F}"
            curl -fsSL -X DELETE "${headers[@]}" "${api}/git/refs/heads/${encoded}" >/dev/null
            count=$((count + 1))
          done <<< "${refs}"

          echo "Deleted ${count} non-main branches."

      - name: Remove this one-shot workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          file="$(curl -fsSL "${headers[@]}" "${api}/contents/.github/workflows/cleanup-stale-branches.yml?ref=${DEFAULT_BRANCH}")"
          sha="$(jq -r '.sha' <<< "${file}")"

          curl -fsSL -X DELETE "${headers[@]}" "${api}/contents/.github/workflows/cleanup-stale-branches.yml" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg message "chore: remove one-shot stale branch cleanup workflow" --arg sha "${sha}" --arg branch "${DEFAULT_BRANCH}" '{message:$message,sha:$sha,branch:$branch}')"
