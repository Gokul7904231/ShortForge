name: OKF Control Plane V3 Validation

on:
  pull_request:
    paths:
      - '.okf/**'
      - 'tools/okf/**'
      - 'apps/web/factoryos/core/governance/**'
      - 'apps/web/factoryos/core/intelligence/epistemic/**'
      - 'apps/web/factoryos/tests/okf-control-plane-v3.test.ts'
      - 'apps/web/app/api/governance/okf/**'
      - 'apps/web/app/(os)/governance/okf/**'
  push:
    branches: [main]
    paths:
      - '.okf/**'
      - 'tools/okf/**'
      - 'apps/web/factoryos/core/governance/**'
      - 'apps/web/factoryos/core/intelligence/epistemic/**'
      - 'apps/web/factoryos/tests/okf-control-plane-v3.test.ts'
      - 'apps/web/app/api/governance/okf/**'
      - 'apps/web/app/(os)/governance/okf/**'

permissions:
  contents: read

jobs:
  v3:
    name: OKF / attestation-policy-context-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install PyYAML
      - name: Compile V2 evidence
        env:
          OKF_BASE_REF: ${{ github.event.pull_request.base.sha }}
          OKF_HEAD_REF: ${{ github.sha }}
        run: |
          if [ -z "$OKF_BASE_REF" ]; then OKF_BASE_REF="${{ github.event.before }}"; fi
          python -m tools.okf.lint
          python -m tools.okf.sweep --base "$OKF_BASE_REF" --head "$OKF_HEAD_REF" --output okf-sweep.json
          python -m tools.okf.drift --json-out okf-drift.json
      - name: Validate OKF Python control-plane tests
        run: python -m unittest tools.okf.tests.test_control_plane tools.okf.tests.test_release_provenance
      - name: Validate Team report against compiled sweep
        if: github.event_name == 'pull_request'
        run: python -m tools.okf.validate_report Team/reports/pr-${{ github.event.pull_request.number }}.json --sweep okf-sweep.json
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Verify V3 governance contracts
        working-directory: apps/web
        run: npx vitest run --config vitest.config.ts factoryos/tests/okf-control-plane-v3.test.ts
      - name: Build unsigned V3 provenance candidate
        run: python -m tools.okf.provenance --sweep okf-sweep.json --drift okf-drift.json --out okf-release-provenance.json
      - name: Require cryptographic attestation keys for signed V3 promotion
        if: ${{ vars.OKF_V3_REQUIRE_SIGNATURE == 'true' }}
        env:
          OKF_ATTESTATION_PRIVATE_KEY_PEM: ${{ secrets.OKF_ATTESTATION_PRIVATE_KEY_PEM }}
          OKF_ATTESTATION_PUBLIC_KEY_PEM: ${{ secrets.OKF_ATTESTATION_PUBLIC_KEY_PEM }}
          OKF_ATTESTATION_KEY_ID: ${{ vars.OKF_ATTESTATION_KEY_ID }}
          OKF_ATTESTATION_KEY_VERSION: ${{ vars.OKF_ATTESTATION_KEY_VERSION }}
        run: node tools/okf/attest.mjs okf-sweep.json okf-signed-attestation.json
      - name: Upload V3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: okf-v3-evidence
          path: |
            okf-sweep.json
            okf-drift.json
            okf-release-provenance.json
            okf-signed-attestation.json
          if-no-files-found: error
