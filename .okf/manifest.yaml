okf_version: 2
manifest_schema: shortforge://okf/manifest/v1
corpus_root: .okf/
rule_index: .okf/rules/index.json
authority_registry: .okf/architecture/authority-registry.json
truth_domains:
  - normative_policy
  - canonical_contract
  - current_implementation
  - verification_evidence
  - historical_record
lifecycle_states:
  - DRAFT
  - ACTIVE
  - EXPERIMENTAL
  - DEPRECATED
  - SUPERSEDED
enforcement_modes:
  - TRACE_ONLY
  - CI
  - RUNTIME
  - GITHUB
  - EVIDENCE
  - HUMAN_APPROVAL
enforcement:
  github_rulesets: REQUIRED
  ci_gate: REQUIRED
  runtime_guards: REQUIRED_FOR_RUNTIME_RULES
  production_helper: REQUIRED_WHERE_APPLICABLE
provenance:
  sweep_attestation: REQUIRED
  release_attestation: REQUIRED
  signing: IMPLEMENTED_KEY_REQUIRED
exception_policy:
  directory: .okf/exceptions/
  required_fields:
    - exceptionId
    - ruleRefs
    - scope
    - approver
    - startsAt
    - expiresAt
    - compensatingControls
    - closureEvidence
    - status

rule_coverage:
  status: PILOT
  active_machine_rules: 6
  migration_target: 100_percent_critical_high

control_plane_v2:
  policy_to_test_binding: REQUIRED
  implementation_drift_detection: REQUIRED
  critical_high_rule_coverage: REQUIRED
  team_report_machine_linkage: REQUIRED
  exception_expiration_enforcement: REQUIRED

control_plane_v3:
  cryptographic_attestations: IMPLEMENTED_KEY_REQUIRED
  release_provenance: IMPLEMENTED_EVIDENCE_ONLY
  aer_ascalon_policy_context: IMPLEMENTED_ADVISORY_ONLY
  governance_dashboard: IMPLEMENTED_OBSERVABILITY_ONLY
  production_promotion: BLOCKED_UNTIL_SIGNING_AND_REPOSITORY_ENFORCEMENT
