<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Overview: golden-short-001 — FactoryOS Visual Inspector</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-elevated: #27272a;
      --border: #3f3f46;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      z-index: 10;
    }
    .brand { font-size: 13px; font-weight: bold; letter-spacing: 1px; color: var(--text); }
    .brand span { color: var(--primary); }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    .btn {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #3f3f46; }
    .btn.active { background: var(--primary); border-color: var(--primary); }
    .search-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 11px;
      font-family: inherit;
      width: 180px;
    }
    .layout-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .canvas-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
      user-select: none;
      background: #09090b;
    }
    .canvas-viewport:active { cursor: grabbing; }
    .graph-transform-layer {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
    }
    .inspector-panel {
      width: 380px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      font-size: 12px;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      z-index: 5;
    }
    .panel-title { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .info-row { display: flex; flex-direction: column; gap: 4px; }
    .info-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .info-val { font-size: 12px; color: var(--text); word-break: break-all; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }
    .badge-truth { background: #3f3f46; color: #38bdf8; }
    .badge-status { background: #27272a; border: 1px solid var(--border); }
    .evidence-pill {
      background: #27272a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      margin-top: 4px;
      font-size: 11px;
    }
    .mismatch-banner {
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 6px;
      border-left: 3px solid;
    }
    .mismatch-banner.size-mismatch {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .mismatch-banner.digest-mismatch {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fcd34d;
    }
    .mismatch-banner.receipt-mismatch {
      background: rgba(217, 70, 239, 0.15);
      border-color: #d946ef;
      color: #f0abfc;
    }
    .audit-card {
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-top: 6px;
    }
    .audit-header {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 4px;
    }
    .audit-row {
      font-size: 11px;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }
    .audit-row span.label {
      color: var(--text-muted);
    }
    .audit-row span.val {
      font-family: monospace;
      font-weight: bold;
    }
    .graph-node:hover rect { stroke: var(--primary) !important; stroke-width: 2px !important; }
    .node-dimmed { opacity: 0.25; }
    .node-highlighted rect { stroke: #38bdf8 !important; stroke-width: 3px !important; }
  </style>

        const text = n.textContent.toLowerCase();
        if (id.includes(term) || text.includes(term)) {
          n.classList.remove("node-dimmed");
          n.classList.add("node-highlighted");
        } else {
          n.classList.add("node-dimmed");
          n.classList.remove("node-highlighted");
        }
      });
    });

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
