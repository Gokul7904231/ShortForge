name: Obsidian Memory Validation

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "tools/obsidian/**"
      - "docs/architecture/obsidian-memory-fabric.md"
      - ".okf/decisions.md"
      - ".github/workflows/obsidian-memory-validation.yml"
      - "apps/web/factoryos/core/intelligence/memory/**"
      - "apps/web/factoryos/core/intelligence/knowledge/**"
      - "apps/web/factoryos/core/intelligence/writer/**"
      - "apps/web/factoryos/core/intelligence/IntelligenceGateway.ts"
      - "apps/web/factoryos/core/controller/AutonomousFactoryController.ts"
      - "apps/web/factoryos/tests/obsidian-memory-fabric.integration.test.ts"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "knowledge/**"
      - "tools/obsidian/**"
      - "docs/architecture/obsidian-memory-fabric.md"
      - ".okf/decisions.md"
      - "apps/web/factoryos/core/intelligence/memory/**"
      - "apps/web/factoryos/core/intelligence/knowledge/**"
      - "apps/web/factoryos/core/intelligence/writer/**"
      - "apps/web/factoryos/core/intelligence/IntelligenceGateway.ts"
      - "apps/web/factoryos/core/controller/AutonomousFactoryController.ts"
      - "apps/web/factoryos/tests/obsidian-memory-fabric.integration.test.ts"
      - "package.json"

jobs:
  validate:
    name: Validate Obsidian memory fabric
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON assets
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const paths = [
            "knowledge/obsidian/clipper/shortforge-source.json",
            "knowledge/obsidian/clipper/shortforge-github.json",
            "knowledge/obsidian/clipper/shortforge-research.json",
            "knowledge/obsidian/canvases/memory-fabric.canvas"
          ];
          for (const file of paths) JSON.parse(fs.readFileSync(file, "utf8"));
          console.log("OBSIDIAN_JSON: PASS");

      - name: Lint memory vault
        run: node tools/obsidian/lint-vault.mjs knowledge

      - name: Build memory catalog
        run: node tools/obsidian/build-catalog.mjs knowledge

      - name: Check catalog is generated
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const p = "knowledge/obsidian/generated/MEMORY_CATALOG.md";
          if (!fs.existsSync(p)) process.exit(1);
          const text = fs.readFileSync(p, "utf8");
          if (!text.includes("# Generated Memory Catalog")) process.exit(1);
          console.log("OBSIDIAN_CATALOG: PASS");

      - name: Install repository dependencies
        run: npm ci

      - name: Live Memory Fabric integration test
        run: npm run test:obsidian-memory-fabric

      - name: Load live Memory Fabric modules
        run: |
          npx tsx --eval "await import('./apps/web/factoryos/core/intelligence/memory/MemoryFabricBridge.ts'); await import('./apps/web/factoryos/core/intelligence/memory/MemoryFabricProjection.ts'); await import('./apps/web/factoryos/core/intelligence/memory/MongoMemoryFabricLedger.ts'); console.log('MEMORY_FABRIC_MODULE_LOAD: PASS')"
