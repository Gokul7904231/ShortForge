name: Treasury Wave 6 Validation

on:
  push:
    branches:
      - feat/treasury-economic-calibration-wave6-20261004
  pull_request:
    paths:
      - "apps/web/factoryos/core/treasury/**"
      - "apps/web/factoryos/tests/treasury-shadow-route-evaluator.test.ts"
      - "apps/web/ai/**"
      - ".okf/**"
      - "docs/treasury-wave6-economic-calibration.md"
      - "Team/reports/pr-*.json"
  workflow_dispatch:

jobs:
  treasury-wave6:
    name: Treasury Wave 6 — Calibration + Shadow Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Wave 6 intelligence tests
        run: npx vitest run factoryos/tests/treasury-economic-intelligence.test.ts factoryos/tests/treasury-shadow-route-evaluator.test.ts
      - name: Treasury admission regressions
        run: npx vitest run factoryos/tests/treasury-economic-admission.test.ts factoryos/tests/treasury-compute-admission.test.ts tests/treasury-provider-retry.test.ts
      - name: Authority regression tests
        run: npx vitest run factoryos/tests/treasury-authority-retirement.test.ts factoryos/tests/treasury-compatibility-retirement.test.ts
