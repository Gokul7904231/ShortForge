name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: TypeCheck & Tests (CI) — no Render OOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: TypeScript TypeCheck (strict, fails CI on error)
        run: cd apps/web && npm run typecheck

      - name: Tests (vitest scoped to factoryos + shortforge)
        run: cd apps/web && npm test
        env:
          NEXT_TELEMETRY_DISABLED: 1
  f01-python:
    name: Floor 01 Python v2 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Floor 01 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.100" "pydantic>=2" pydantic-settings pytest structlog httpx

      - name: Run Floor 01 v2 test suite
        working-directory: services/pipeline
        run: python -m pytest floor01_strategy/tests/ -q
