name: TEMP F02 Debug\n\non:\n  push:\n    branches:\n      - feat/floor02-cognitive-production-v2\n\npermissions:\n  contents: read\n  issues: write\n  pull-requests: write\n\njobs:\n  debug:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Install deps\n        run: python -m pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3" "structlog>=24,<26" "pytest>=8,<9" "httpx>=0.27,<1"\n      - name: Run F02 tests\n        id: tests\n        continue-on-error: true\n        run: |\n          set -o pipefail\n          FLOOR02_ENV=test FLOOR02_ALLOW_DETERMINISTIC_FALLBACK=true python -m pytest services/pipeline/floor02_scripting/tests/ -vv 2>&1 | tee /tmp/f02-test.log\n      - name: Comment failure\n        if: steps.tests.outcome == 'failure'\n        uses: actions/github-script@v7\n        with:\n          script: |\n            const fs = require('fs');\n            const log = fs.readFileSync('/tmp/f02-test.log', 'utf8');\n            const body = '### Temporary F02 debug output\n\n' + '```text\n' + log.slice(-14000) + '\n```';\n            await github.rest.issues.createComment({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              issue_number: 17,\n              body\n            });\n      - name: Fail job\n        if: steps.tests.outcome == 'failure'\n        run: exit 1\n