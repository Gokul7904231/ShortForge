name: FactoryOS Render Worker & Queue Dispatcher

# Pulls one queued BASIC job off the control-plane queue and hands it to
# factoryos-basic-render.yml. Claim handling lives in
# services/rendering-engine/scripts/github_dispatch_claim.py, where it is tested.
#
# Fail-closed rules:
#  - RENDER_WORKER_SECRET has no default. Missing/empty config fails the job
#    before any request is made (docs/deployment/render-worker-secrets.md).
#  - An HTTP error, timeout or malformed response fails the job. It is never
#    reported as an empty queue.
#  - A `repository_dispatch` that names a job is refused: /api/rendering/claim
#    cannot target a named job, so such a dispatch must not become an unrelated
#    generic claim. The supported immediate path is the control plane calling
#    GitHubActionsRenderManager.dispatchWorkflowRun() (a workflow_dispatch of
#    factoryos-basic-render.yml with jobId + executionToken).

on:
  schedule:
    - cron: "* * * * *"  # 1-minute fallback sweep; the immediate path is a direct workflow_dispatch
  workflow_dispatch:
  repository_dispatch:
    types: [factoryos_render_job]

# Single dispatcher at a time — prevents double-claim races
concurrency:
  group: factoryos-render-dispatcher
  cancel-in-progress: false

jobs:
  dispatch_queue:
    name: Claim Queued Video & Dispatch Render Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout FactoryOS Dispatcher Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claim Queued Basic Job from FactoryOS Control Plane
        id: claim_job
        env:
          CONTROL_PLANE_URL: ${{ secrets.FACTORYOS_CONTROL_PLANE_URL || 'https://factoryos.app' }}
          # Fail closed when unset: `secrets.X` expands to an empty string, which the
          # claim API rejects. Never add a default here — a committed shared secret
          # is compromised by definition, and it silently turns an auth failure into
          # what looks like an empty queue. Rotation: docs/deployment/render-worker-secrets.md
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
          # repository_dispatch payload (the only field an emitter would set).
          # /api/rendering/claim accepts only workerId + workerPool and cannot target
          # a named job, so a payload that names one is refused instead of being
          # downgraded into an unrelated generic queue claim.
          DISPATCH_JOB_ID: ${{ github.event.client_payload.jobId }}
        run: python3 services/rendering-engine/scripts/github_dispatch_claim.py

      - name: Trigger Basic Video Render Workflow
        if: steps.claim_job.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.claim_job.outputs.job_id }}
          EXECUTION_TOKEN: ${{ steps.claim_job.outputs.execution_token }}
        run: |
          echo "::add-mask::$EXECUTION_TOKEN"
          echo "Dispatching Basic Render Pipeline for Job $JOB_ID..."
          # No `|| echo` fallback: a failed dispatch must fail this job. Dispatching
          # needs `actions: write` on GITHUB_TOKEN; if the repository default is
          # read-only this step now fails loudly instead of appearing to succeed.
          gh workflow run factoryos-basic-render.yml \
            -f jobId="$JOB_ID" \
            -f executionToken="$EXECUTION_TOKEN"
