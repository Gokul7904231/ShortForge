name: Floor 06 Pre-Training Validation

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/fabric/**"
      - "apps/web/factoryos/core/compute/**"
      - "apps/web/factoryos/core/rendering/**"
      - "apps/web/factoryos/tests/f06-render-admission.test.ts"
      - "services/pipeline/floor06_rendering/**"
      - "services/pipeline/floor05_timeline_composition/**"
      - "services/pipeline/floor04_media_synthesis/**"
      - "services/pipeline/floor03_asset_realization/**"
      - "training/ascalon/ontology/**"
      - ".okf/**"
      - "Team/reports/**"
      - ".github/workflows/floor06-pretraining-validation.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/factoryos/core/fabric/**"
      - "apps/web/factoryos/core/compute/**"
      - "apps/web/factoryos/core/rendering/**"
      - "apps/web/factoryos/tests/f06-render-admission.test.ts"
      - "services/pipeline/floor06_rendering/**"
      - "training/ascalon/ontology/**"
      - ".okf/**"
      - "Team/reports/**"

jobs:
  floor06:
    name: Floor 06 physical admission + pre-training validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Ensure FFmpeg and FFprobe exist
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck F06 changed modules
        working-directory: apps/web
        run: >-
          npx tsc --ignoreConfig --noEmit --skipLibCheck --target ES2022 --module NodeNext
          --moduleResolution NodeNext --types node
          factoryos/core/compute/contracts/ComputeContracts.ts
          factoryos/core/compute/router/ComputeRouter.ts
          factoryos/core/fabric/verification/RenderArtifactVerifier.ts
          factoryos/tests/f06-render-admission.test.ts

      - name: Run F06 admission tests
        working-directory: apps/web
        run: npx vitest run factoryos/tests/f06-render-admission.test.ts --config vitest.config.ts

      - name: Run focused F06 routing regression
        working-directory: apps/web
        run: npx vitest run factoryos/tests/f06-render-admission.test.ts --config vitest.config.ts

      - name: Compile F03/F04/F05/F06 Python contracts
        run: |
          python -m compileall -q             services/pipeline/floor03_asset_realization             services/pipeline/floor04_media_synthesis             services/pipeline/floor05_timeline_composition             services/pipeline/floor06_rendering

      - name: Run cross-floor handoff contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "pydantic>=2.7,<3" "pydantic-settings>=2.4,<3" "structlog>=24,<26" "pytest>=8,<9" "httpx>=0.27,<1"
          PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/services/pipeline:$GITHUB_WORKSPACE/services/pipeline/floor01_strategy:$GITHUB_WORKSPACE/apps/web             python -m pytest               services/pipeline/floor03_asset_realization/tests/test_floor03_handoff.py               services/pipeline/floor04_media_synthesis/tests/test_floor04_handoff.py               services/pipeline/floor05_timeline_composition/tests/test_floor05_handoff.py               services/pipeline/floor06_rendering/tests/test_floor06_handoff.py -q

      - name: Validate Ascalon F06 admission ontology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("training/ascalon/ontology/capabilities.json").read_text())
          cap=next(c for c in data["capabilities"] if c["capabilityId"]=="cap_render_dispatch")
          assert cap["version"]=="1.1.0"
          assert cap["requiresGuardianGate"] is True
          assert "render_admission_record" in cap["trainingEvidence"]
          print("Ascalon F06 admission ontology: PASS")
          PY
