name: Compute Pool

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/compute/**"
      - "apps/web/factoryos/core/fabric/**"
      - "apps/web/factoryos/tests/**"
      - ".okf/compute/**"
  push:
    branches:
      - main
    paths:
      - "apps/web/factoryos/core/compute/**"
      - "apps/web/factoryos/core/fabric/**"
      - ".okf/compute/**"

jobs:
  validate:
    name: Unified compute pool validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      FASTINO_GLIDE_ENABLED: "false"
      FASTINO_GLIDE_ROUTING_MODE: "OFF"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck

      - name: Compute and sandbox tests
        run: npx vitest run factoryos/tests/sandbox-fabric.test.ts factoryos/tests/compute-connection-hub.test.ts factoryos/tests/compute-pool.test.ts factoryos/tests/glide-compute-router-mode.test.ts --config vitest.config.ts
