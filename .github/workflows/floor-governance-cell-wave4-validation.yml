name: Floor Governance Cell Wave 4 Validation

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/governance/FloorCouncil.ts"
      - "apps/web/factoryos/core/governance/FloorGovernanceCell.ts"
      - "apps/web/factoryos/core/contracts/EventContracts.ts"
      - "apps/web/factoryos/core/guardian/GuardianManager.ts"
      - "apps/web/factoryos/core/controller/AutonomousFactoryController.ts"
      - "apps/web/factoryos/core/index.ts"
      - "apps/web/factoryos/tests/floor-council-wave4.test.ts"
      - ".okf/cognitive/**"
      - ".okf/intelligence/**"
      - ".okf/decisions/**"
  workflow_dispatch:

jobs:
  wave4-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck Wave 4 cognitive-governance boundary
        working-directory: apps/web
        run: |
          npx tsc --noEmit --ignoreConfig             --target ES2022             --module ESNext             --moduleResolution bundler             --skipLibCheck             --types node             factoryos/core/governance/FloorGovernanceContracts.ts             factoryos/core/governance/FloorActionGraph.ts             factoryos/core/governance/DefaultFloorActionGraph.ts             factoryos/core/governance/FloorBlackboard.ts             factoryos/core/governance/FloorBlackboardJournal.ts             factoryos/core/governance/FloorCouncil.ts             factoryos/core/governance/FloorActionGate.ts             factoryos/core/governance/FloorGovernanceCell.ts             factoryos/core/governance/AscalonGuardianAdapter.ts             factoryos/core/guardian/GuardianContracts.ts             factoryos/core/guardian/GuardianKernel.ts             factoryos/core/guardian/GuardianManager.ts             factoryos/core/cognitive/CognitiveDecisionContext.ts             factoryos/core/cognitive/CognitiveRuntime.ts             factoryos/core/cognitive/CognitivePlaneEngine.ts             factoryos/core/controller/AutonomousFactoryController.ts

      - name: Run Wave 4 focused tests
        working-directory: apps/web
        run: >
          npx vitest run
          factoryos/tests/floor-council-wave4.test.ts
          factoryos/tests/cognitive-simulation-gate.test.ts
          factoryos/tests/cognitive-evidence-contradiction.test.ts
          factoryos/tests/cognitive-fallback-safety.test.ts
          --config vitest.config.ts
