name: notebook-fabric

# Live notebook verification is an external side-effecting workflow. Keep only
# the newest probe active so repeated code pushes cannot consume concurrent
# Kaggle notebook capacity or race their artifacts.
concurrency:
  group: notebook-fabric-live-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/compute/notebooks/**"
      - "apps/web/factoryos/tests/notebook-fabric.test.ts"
      - "apps/web/scripts/verify-notebooks.ts"
      - "apps/web/scripts/verify-notebook-mcps.mjs"
      - ".okf/compute/notebook-fabric.md"
      - ".okf/compute/notebook-mcp.md"
      - ".github/workflows/notebook-fabric.yml"
      - ".env.notebooks.example"
      - "tools/mcp/kaggle-notebook-mcp/**"
      - "tools/mcp/colab-notebook-mcp/**"
      - "tools/mcp/lightning-notebook-mcp/**"
      - "tools/mcp/notebook-mcp.example.json"
  push:
    branches:
      - "feat/notebook-live-mcp-20261002"
  workflow_dispatch:
    inputs:
      provider:
        description: "Live provider to validate"
        required: true
        default: "KAGGLE"
        type: choice
        options:
          - KAGGLE
          - COLAB
          - LIGHTNING
          - NONE
      live:
        description: "Explicitly allow external provider calls"
        required: true
        default: false
        type: boolean
      colab_provision:
        description: "For COLAB, create/delete one runtime during the smoke"
        required: true
        default: false
        type: boolean
      lightning_machine:
        description: "For LIGHTNING, machine name used by the smoke"
        required: true
        default: "CPU"
        type: string

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install app dependencies
        working-directory: apps/web
        run: npm ci
      - name: FactoryOS typecheck
        working-directory: apps/web
        run: npm run factoryos:typecheck
      - name: Notebook contract tests
        working-directory: apps/web
        run: npx vitest run factoryos/tests/notebook-fabric.test.ts

  mcp_contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - kaggle-notebook-mcp
          - colab-notebook-mcp
          - lightning-notebook-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MCP package dependencies
        working-directory: tools/mcp/${{ matrix.provider }}
        run: npm install --no-audit --no-fund
      - name: Typecheck MCP package
        working-directory: tools/mcp/${{ matrix.provider }}
        run: npm run typecheck

  prepare_live:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feat/notebook-live-mcp-20261002') || (github.event_name == 'workflow_dispatch' && inputs.live == true && inputs.provider != 'NONE') }}
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'providers=["%s"]\n' "$INPUT_PROVIDER" >> "$GITHUB_OUTPUT"
          else
            # Pushes on the dedicated verification branch are intentionally
            # Kaggle-first. Colab/Lightning are run explicitly after Kaggle's
            # physical-artifact and MCP proofs pass.
            echo 'providers=["KAGGLE"]' >> "$GITHUB_OUTPUT"
          fi

  live:
    needs: prepare_live
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.prepare_live.outputs.providers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install app dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Kaggle CLI
        if: ${{ matrix.provider == 'KAGGLE' }}
        run: python -m pip install --upgrade kaggle
      - name: Install Lightning SDK
        if: ${{ matrix.provider == 'LIGHTNING' }}
        run: python -m pip install --upgrade lightning-sdk
      - name: Install ffmpeg
        if: ${{ matrix.provider == 'KAGGLE' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install notebook MCP packages
        run: |
          npm install --prefix tools/mcp/kaggle-notebook-mcp --no-audit --no-fund
          npm install --prefix tools/mcp/colab-notebook-mcp --no-audit --no-fund
          npm install --prefix tools/mcp/lightning-notebook-mcp --no-audit --no-fund
      - name: Export live controls
        env:
          NOTEBOOK_PROVIDER: ${{ matrix.provider }}
          NOTEBOOK_LIVE: "1"
          COLAB_LIVE_PROVISION: ${{ github.event_name == 'push' && '1' || (inputs.colab_provision && '1' || '0') }}
          LIGHTNING_LIVE_MACHINE: ${{ github.event_name == 'push' && 'CPU' || inputs.lightning_machine }}
        run: |
          echo "NOTEBOOK_PROVIDER=$NOTEBOOK_PROVIDER" >> "$GITHUB_ENV"
          echo "NOTEBOOK_LIVE=$NOTEBOOK_LIVE" >> "$GITHUB_ENV"
          echo "COLAB_LIVE_PROVISION=$COLAB_LIVE_PROVISION" >> "$GITHUB_ENV"
          echo "LIGHTNING_LIVE_MACHINE=$LIGHTNING_LIVE_MACHINE" >> "$GITHUB_ENV"
      - name: Validate required provider secret names
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # Preserve timed-out Kaggle probes for post-failure forensic inspection.
          # Successful physical-artifact proofs still trigger normal cleanup.
          KAGGLE_KEEP_FAILED_RUNTIME: "1"
          COLAB_ACCESS_TOKEN: ${{ secrets.COLAB_ACCESS_TOKEN }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        run: |
          set -euo pipefail
          case "$NOTEBOOK_PROVIDER" in
            KAGGLE)
              test -n "$KAGGLE_USERNAME" || { echo "Missing KAGGLE_USERNAME"; exit 1; }
              test -n "$KAGGLE_KEY" || { echo "Missing KAGGLE_KEY"; exit 1; }
              ;;
            COLAB)
              test -n "$COLAB_ACCESS_TOKEN" || { echo "Missing COLAB_ACCESS_TOKEN"; exit 1; }
              ;;
            LIGHTNING)
              test -n "$LIGHTNING_USER_ID" || { echo "Missing LIGHTNING_USER_ID"; exit 1; }
              test -n "$LIGHTNING_API_KEY" || { echo "Missing LIGHTNING_API_KEY"; exit 1; }
              ;;
          esac
      - name: Provider live smoke
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # Keep failed/timeout probes available for forensic inspection. This
          # must be on the provider step itself; step-local env does not persist.
          KAGGLE_KEEP_FAILED_RUNTIME: "1"
          COLAB_ACCESS_TOKEN: ${{ secrets.COLAB_ACCESS_TOKEN }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
        working-directory: apps/web
        run: npm run factoryos:verify:notebooks
      - name: Upload Kaggle live MP4 proof
        if: ${{ matrix.provider == 'KAGGLE' }}
        uses: actions/upload-artifact@v4
        with:
          name: shortforge-kaggle-live-mp4
          path: artifacts/kaggle-live/shortforge-live-notebook-probe.mp4
          if-no-files-found: error
          retention-days: 14

      - name: MCP live smoke
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          COLAB_ACCESS_TOKEN: ${{ secrets.COLAB_ACCESS_TOKEN }}
          LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          NOTEBOOK_MCP_PROVIDER: ${{ matrix.provider }}
        run: node apps/web/scripts/verify-notebook-mcps.mjs
