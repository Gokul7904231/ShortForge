name: FactoryOS Basic Cloud Rendering Pipeline

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'FactoryOS RenderJob ID'
        required: true
        type: string
      executionToken:
        description: 'Short-lived FactoryOS Execution Token'
        required: true
        type: string
  repository_dispatch:
    types: [factoryos_render_job]

jobs:
  render:
    name: Execute Basic FFmpeg Render
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout FactoryOS Render Engine Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/rendering-engine/requirements.txt

      - name: Install FFmpeg (cached binary)
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        id: setup-ffmpeg
        with:
          ffmpeg-version: "6.1.1"

      - name: Cache pip dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('services/rendering-engine/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Render Dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/rendering-engine/requirements.txt

      - name: Resolve Job Inputs
        id: resolve_inputs
        env:
          INPUT_JOB_ID: ${{ github.event.inputs.jobId || github.event.client_payload.jobId }}
          INPUT_EXEC_TOKEN: ${{ github.event.inputs.executionToken || github.event.client_payload.executionToken }}
        run: |
          JOB_ID="$INPUT_JOB_ID"
          EXEC_TOKEN="$INPUT_EXEC_TOKEN"
          if ! [[ "$JOB_ID" =~ ^[a-zA-Z0-9_-]{8,64}$ ]]; then
            echo "::error::Invalid jobId format — must match ^[a-zA-Z0-9_-]{8,64}$"
            exit 1
          fi
          if [ -z "$EXEC_TOKEN" ]; then
            echo "::error::Missing executionToken — fail-closed (no jobId fallback)"
            exit 1
          fi
          WORKSPACE_DIR="/tmp/factoryos-render/${JOB_ID}"
          mkdir -p "$WORKSPACE_DIR"
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "execution_token=$EXEC_TOKEN" >> $GITHUB_OUTPUT
          echo "workspace_dir=$WORKSPACE_DIR" >> $GITHUB_OUTPUT
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV
          echo "EXECUTION_TOKEN=$EXEC_TOKEN" >> $GITHUB_ENV
          echo "WORKSPACE_DIR=$WORKSPACE_DIR" >> $GITHUB_ENV
          echo "Resolved JOB_ID=$JOB_ID workspace=$WORKSPACE_DIR"

      - name: Fetch Job Manifest
        env:
          CONTROL_PLANE_URL: ${{ secrets.FACTORYOS_CONTROL_PLANE_URL || 'https://factoryos.app' }}
        run: |
          python3 -c "
          import urllib.request, json, os
          ws = os.environ['WORKSPACE_DIR']
          job_id = os.environ['JOB_ID']
          token = os.environ['EXECUTION_TOKEN']
          url = f\"{os.environ['CONTROL_PLANE_URL'].rstrip('/')}/api/jobs/{job_id}\"
          headers = {'x-execution-token': token, 'Authorization': f\"Bearer {token}\"}
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  manifest = data.get('job', data)
                  out = os.path.join(ws, 'payload.json')
                  with open(out, 'w') as f:
                      json.dump(manifest, f)
                  print(f'Job manifest fetched: {out} keys={list(manifest.keys())[:10]}')
          except Exception as e:
              print(f'::error::Fetch manifest failed: {e}')
              import sys
              sys.exit(1)
          "

      - name: Execute Render Engine (create_short.py)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          set -e
          MANIFEST="$WORKSPACE_DIR/payload.json"
          echo "Rendering $JOB_ID via create_short.py manifest=$MANIFEST..."
          # Run real engine; timeout 6 min to stay inside <2min SLA for QUIZ (fast path 60-90s)
          timeout 360 python services/rendering-engine/scripts/create_short.py "$MANIFEST" || {
            echo "::warning::create_short.py failed or timed out — falling back to placeholder check"
            # Ensure we still have a video for validation step to give actionable error
            exit 1
          }
          echo "Render engine completed"
          find "$WORKSPACE_DIR" -type f -name "*.mp4" -o -name "result.json" | head -n 20

      - name: Validate Generated MP4 Container & Artifact
        id: validate_mp4
        run: |
          OUTPUT_MP4=$(find "$WORKSPACE_DIR" -name "final.mp4" -o -name "output.mp4" | head -n 1)
          if [ -z "$OUTPUT_MP4" ]; then
            OUTPUT_MP4=$(find /tmp/factoryos-render -name "final.mp4" | head -n 1)
          fi
          if [ -z "$OUTPUT_MP4" ] || [ ! -f "$OUTPUT_MP4" ]; then
            echo "::error::Rendered MP4 not found under $WORKSPACE_DIR"
            find "$WORKSPACE_DIR" -type f | head -n 30
            exit 1
          fi
          echo "OUTPUT_MP4=$OUTPUT_MP4" >> $GITHUB_ENV
          FILE_SIZE=$(stat -c%s "$OUTPUT_MP4")
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::MP4 suspiciously small: $FILE_SIZE bytes"
            exit 1
          fi
          echo "Validating with ffprobe..."
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height -of json "$OUTPUT_MP4" > "$WORKSPACE_DIR/probe.json"
          if [ $? -ne 0 ] || [ ! -s "$WORKSPACE_DIR/probe.json" ]; then
            echo "::error::ffprobe validation failed for $OUTPUT_MP4"
            exit 1
          fi
          cat "$WORKSPACE_DIR/probe.json"
          SHA256_HASH=$(sha256sum "$OUTPUT_MP4" | awk '{print $1}')
          echo "SHA256_HASH=$SHA256_HASH" >> $GITHUB_ENV
          DURATION=$(python3 -c "import json; print(json.load(open('$WORKSPACE_DIR/probe.json')).get('format',{}).get('duration', '0'))")
          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=$(awk \"BEGIN{printf \\\"%.2f\\\", $FILE_SIZE/1048576}\")" >> $GITHUB_ENV
          echo "MP4 validated: $FILE_SIZE bytes, $DURATION seconds, sha256: $SHA256_HASH"

      - name: Upload Artifact to Persistent Storage
        id: upload_storage
        if: steps.validate_mp4.outcome == 'success'
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET_NAME || 'factoryos-renders' }}
        run: |
          echo "Upload phase complete (Managed in engine and storage resolver)"

      - name: Callback Control Plane with Completion Status
        if: always()
        env:
          CONTROL_PLANE_URL: ${{ secrets.FACTORYOS_CONTROL_PLANE_URL || 'https://factoryos.app' }}
          WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET || 'factoryos-render-worker-secret-key-2026' }}
          RENDER_STATUS: ${{ steps.validate_mp4.outcome == 'success' && 'completed' || 'failed' }}
        run: |
          python3 -c "
          import urllib.request, json, os, pathlib
          url = f\"{os.environ['CONTROL_PLANE_URL'].rstrip('/')}/api/rendering/callback\"
          status = os.environ.get('RENDER_STATUS','failed')
          job_id = os.environ['JOB_ID']
          token = os.environ['EXECUTION_TOKEN']
          ws = os.environ['WORKSPACE_DIR']
          video_url = None
          for p in [f\"{ws}/{job_id}/result.json\", f\"{ws}/result.json\"]:
              try:
                  pp = pathlib.Path(p)
                  if pp.exists():
                      j = json.loads(pp.read_text())
                      if j.get('videoUrl'):
                          video_url = j['videoUrl']
                          break
              except: pass

          if status == 'completed' and not video_url:
              print('::error::No verified videoUrl found in engine result.json; marking callback failed')
              status = 'failed'

          body = {
              'jobId': job_id,
              'status': status,
              'videoUrl': video_url if status == 'completed' else None,
              'videoSizeMb': float(os.environ.get('FILE_SIZE_MB', '0')) if status == 'completed' else 0.0,
              'renderDurationSeconds': float(os.environ.get('DURATION', '0')) if status == 'completed' else 0.0,
              'artifactSha256': os.environ.get('SHA256_HASH') if status == 'completed' else None,
              'executionToken': token,
          }
          headers = {'Content-Type':'application/json','Authorization':f\"Bearer {os.environ['WORKER_SECRET']}\",'x-execution-token': token}
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f'Callback {resp.status}: {resp.read().decode()[:500]}')
          except Exception as e:
              print(f'Callback notice: {e}')
          "

      - name: Clean Local Workspace
        if: always()
        run: |
          rm -rf "/tmp/factoryos-render/${JOB_ID}" || true
          echo "Workspace cleaned"
