name: InstaVM Dependency Lock Sync

on:
  push:
    branches:
      - feat/sandbox-instavm-integration-20261006

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build(sandbox): lock InstaVM SDK dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
