name: compute-connection-hub

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/compute/connections/**"
      - "apps/web/app/api/compute/**"
      - "apps/web/app/(os)/settings/compute/**"
      - "apps/web/factoryos/tests/compute-connection-hub.test.ts"
      - ".okf/compute/connection-hub.md"
  push:
    branches:
      - "main"
      - "feat/notebook-fabric-v1-20261001"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: FactoryOS typecheck
        working-directory: apps/web
        run: npm run factoryos:typecheck
      - name: Connection Hub contract tests
        working-directory: apps/web
        run: npx vitest run factoryos/tests/compute-connection-hub.test.ts