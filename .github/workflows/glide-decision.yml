name: GLiDE Decision System

on:
  pull_request:
    paths:
      - "apps/web/factoryos/core/intelligence/decision/**"
      - "apps/web/factoryos/core/compute/router/GlideWorkerSelectionAdvisor.ts"
      - "apps/web/factoryos/core/compute/router/ComputeRouter.ts"
      - "apps/web/factoryos/core/compute/gateway/ComputeGateway.ts"
      - "apps/web/factoryos/tests/glide-*.test.ts"
      - ".okf/decisions/glide-decision-system-20261002.md"
  push:
    branches:
      - main
    paths:
      - "apps/web/factoryos/core/intelligence/decision/**"
      - "apps/web/factoryos/core/compute/router/GlideWorkerSelectionAdvisor.ts"
      - "apps/web/factoryos/core/compute/router/ComputeRouter.ts"
      - "apps/web/factoryos/core/compute/gateway/ComputeGateway.ts"
      - "apps/web/factoryos/tests/glide-*.test.ts"

jobs:
  validate:
    name: GLiDE adapter + worker decision tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      FASTINO_GLIDE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck

      - name: GLiDE adapter and worker selection tests
        run: npx vitest run factoryos/tests/glide-decision-adapter.test.ts factoryos/tests/glide-worker-selection-advisor.test.ts factoryos/tests/glide-compute-router-mode.test.ts --config vitest.config.ts
