name: Live Multi-Provider Render

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Render provider"
        required: true
        type: choice
        options:
          - AMD
          - KAGGLE
          - DAYTONA
          - MODAL

permissions:
  contents: read

jobs:
  live-render:
    name: Real ${{ inputs.provider }} render through ComputePool
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_COMPUTE_PROVIDER_TYPE: ${{ inputs.provider }}
      RUN_LIVE_COMPUTE: "1"
      AMD_WORKER_URL: ${{ secrets.AMD_WORKER_URL }}
      AMD_WORKER_SECRET: ${{ secrets.AMD_WORKER_SECRET }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
      DAYTONA_TARGET: ${{ secrets.DAYTONA_TARGET }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck
      - name: Run physical provider smoke
        run: npx vitest run factoryos/tests/live-multi-provider-render.test.ts --config vitest.config.ts --reporter=verbose