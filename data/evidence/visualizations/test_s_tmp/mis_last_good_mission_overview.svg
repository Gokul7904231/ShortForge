<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" class="factoryos-graph" role="img" aria-label="Valid Baseline">
  <defs>
    <marker id="arrow-default" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#71717a" />
    </marker>
    <marker id="arrow-critical" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444" />
    </marker>
    <marker id="arrow-verified" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981" />
    </marker>
    <filter id="focal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.6" />
    </filter>
    <filter id="alert-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.8" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#09090b" />
  <g class="graph-header" transform="translate(40, 35)">
    <text x="0" y="0" font-family="monospace" font-size="16" font-weight="bold" fill="#f4f4f5">Valid Baseline</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#a1a1aa">Last Good Test</text>
  </g>
  <g class="graph-edges">
  </g>
  <g class="graph-nodes">
    <g id="n1" data-node-id="n1" data-canonical-id="n1" data-node-type="FLOOR" data-status="VERIFIED" data-truth="VERIFIED" class="graph-node" transform="translate(60, 60)" cursor="pointer" role="button" tabindex="0" aria-label="Node n1: Node 1" >
      <rect width="220" height="88" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"  />
      <line x1="0" y1="84" x2="220" y2="84" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
      <text x="10" y="18" font-family="monospace" font-size="9" font-weight="bold" fill="#a1a1aa" letter-spacing="0.5">FLOOR</text>
      <text x="210" y="18" text-anchor="end" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">VERIFIED</text>
      <text x="10" y="42" font-family="monospace" font-size="11" font-weight="bold" fill="#f4f4f5">Node 1</text>
      <text x="10" y="64" font-family="monospace" font-size="9" fill="#71717a">VERIFIED </text>
    </g>
  </g>
</svg>