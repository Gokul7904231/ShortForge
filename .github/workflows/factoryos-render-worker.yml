name: FactoryOS Render Worker & Queue Dispatcher

on:
  schedule:
    - cron: "* * * * *"  # every 1 min fallback — primary is immediate dispatch from /api/generate-video (no 5-min wait)
  workflow_dispatch:
  repository_dispatch:
    types: [factoryos_render_job]

# Single dispatcher at a time — prevents double-claim races
concurrency:
  group: factoryos-render-dispatcher
  cancel-in-progress: false

jobs:
  dispatch_queue:
    name: Claim Queued Video & Dispatch Render Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout FactoryOS Dispatcher Tools
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claim Queued Basic Job from FactoryOS Control Plane
        id: claim_job
        env:
          CONTROL_PLANE_URL: ${{ secrets.FACTORYOS_CONTROL_PLANE_URL || 'https://factoryos.app' }}
          # No fallback literal: missing secret expands to an empty string (see rotation note
          # in docs/deployment/render-worker-secrets.md; loud guard ships with PR #247).
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
        run: |
          python3 -c "
          import urllib.request, json, os

          # Immediate dispatch payload (repository_dispatch from /api/generate-video) — try direct job first
          import sys
          direct_job = os.environ.get('DISPATCH_JOB_ID', '')
          if direct_job:
              print(f'Direct dispatch for job {direct_job} — will claim via API')
          url = f\"{os.environ['CONTROL_PLANE_URL'].rstrip('/')}/api/rendering/claim\"
          headers = {
              'Content-Type': 'application/json',
              'Authorization': f\"Bearer {os.environ['RENDER_WORKER_SECRET']}\"
          }
          payload = {'workerId': 'gh-dispatcher-runner', 'workerPool': 'github-actions'}
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode())
                  if data.get('claimed') and 'job' in data:
                      job = data['job']
                      print(f\"CLAIMED_JOB_ID={job['jobId']}\")
                      print(f\"EXECUTION_TOKEN={job['executionToken']}\")
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write(f\"claimed=true\n\")
                          f.write(f\"job_id={job['jobId']}\n\")
                          f.write(f\"execution_token={job['executionToken']}\n\")
                  else:
                      print('No queued basic video jobs to process.')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                          f.write('claimed=false\n')
          except Exception as e:
              print(f'Queue claim status: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('claimed=false\n')
          "

      - name: Trigger Basic Video Render Workflow
        if: steps.claim_job.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.claim_job.outputs.job_id }}
          EXECUTION_TOKEN: ${{ steps.claim_job.outputs.execution_token }}
        run: |
          echo "Dispatching Basic Render Pipeline for Job $JOB_ID..."
          gh workflow run factoryos-basic-render.yml \
            -f jobId="$JOB_ID" \
            -f executionToken="$EXECUTION_TOKEN" || echo "Workflow dispatch queued locally"
