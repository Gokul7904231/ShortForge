name: Live Hosted Sandbox Render Proof

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Hosted sandbox provider"
        required: true
        default: DAYTONA
        type: choice
        options:
          - DAYTONA
          - MODAL
          - INSTAVM
          - OPENCOMPUTER
          - BLAXEL
      image:
        description: "Sandbox image containing ffmpeg"
        required: true
        default: ghcr.io/jrottenberg/ffmpeg:9.0.1-ubuntu2404
        type: string


permissions:
  contents: read

jobs:
  live-sandbox:
    name: ${{ inputs.provider }} physical render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHORTFORGE_LIVE_SANDBOX_PROVIDER: ${{ inputs.provider }}
      SHORTFORGE_LIVE_SANDBOX_IMAGE: ${{ inputs.image }}
      SHORTFORGE_LIVE_SANDBOX_OUTPUT_PATH: /tmp/shortforge/live-smoke.mp4
      SHORTFORGE_LIVE_SANDBOX_EVIDENCE_PATH: /tmp/shortforge/live-sandbox-f07-evidence.json
      SHORTFORGE_LIVE_SANDBOX_RENDER_COMMAND: >-
        mkdir -p /tmp/shortforge &&
        if command -v ffmpeg >/dev/null 2>&1; then true;
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache ffmpeg;
        elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends ffmpeg;
        else echo "FFMPEG_INSTALL_UNSUPPORTED"; exit 127; fi &&
        ffmpeg -y -f lavfi -i color=c=black:s=1080x1920:d=1
        -f lavfi -i anullsrc=r=48000:cl=mono -shortest
        -c:v libx264 -pix_fmt yuv420p -c:a aac
        {{OUTPUT_PATH}}
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
      DAYTONA_TARGET: ${{ secrets.DAYTONA_TARGET }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_SANDBOX_APP_NAME: ${{ secrets.MODAL_SANDBOX_APP_NAME }}
      MODAL_SANDBOX_IMAGE: ${{ inputs.image }}
      INSTAVM_API_KEY: ${{ secrets.INSTAVM_API_KEY }}
      INSTAVM_SNAPSHOT_ID: ${{ secrets.INSTAVM_SNAPSHOT_ID }}
      OPENCOMPUTER_API_KEY: ${{ secrets.OPENCOMPUTER_API_KEY }}
      OPENCOMPUTER_API_URL: ${{ secrets.OPENCOMPUTER_API_URL }}
      OPENCOMPUTER_TEMPLATE: base
      BL_API_KEY: ${{ secrets.BL_API_KEY }}
      BL_WORKSPACE: ${{ secrets.BL_WORKSPACE }}
      BLAXEL_SANDBOX_IMAGE: blaxel/base-image:latest
      BLAXEL_REGION: ${{ secrets.BLAXEL_REGION }}
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install optional hosted sandbox SDKs
        run: npm install --no-save --no-package-lock --legacy-peer-deps @daytona/sdk modal instavm @opencomputer/sdk@2.3.0 @blaxel/core@0.3.25
      - name: Install verifier-host FFmpeg / FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: FactoryOS strict typecheck
        run: npm run factoryos:typecheck
      - name: Run live hosted sandbox proof
        run: npx vitest run factoryos/tests/live-hosted-sandbox.test.ts --config vitest.config.ts --reporter=verbose
      - name: Upload F07 physical proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hosted-sandbox-f07-evidence
          path: /tmp/shortforge/live-sandbox-f07-evidence.json
          if-no-files-found: warn
